{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapIt - Workspace</title>
    <link rel="icon" type="image/png" href="{% static 'logo.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A0A0A;
            color: #EDEDED;
        }

        .glass-card {
            background: rgba(23, 23, 23, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .ambient-glow {
            box-shadow: 0 0 40px rgba(96, 165, 250, 0.15);
        }
    </style>
</head>

<body class="h-screen flex overflow-hidden selection:bg-blue-500/30">
    {% include 'core/includes/sidebar.html' %}

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative h-full overflow-y-auto">
        {% include 'core/includes/navbar.html' %}
        <div class="px-5 py-6 sm:p-6 md:p-8 max-w-5xl mx-auto w-full flex-1">
            {% block content %}{% endblock %}
        </div>
        {% include 'core/includes/footer.html' %}
    </main>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }
    </script>
</body>

</html>
