<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapIt - Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A0A0A;
            color: #EDEDED;
        }

        .glass-card {
            background: rgba(23, 23, 23, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .ambient-glow {
            box-shadow: 0 0 40px rgba(96, 165, 250, 0.15);
        }
    </style>
</head>

<body class="h-screen flex overflow-hidden selection:bg-blue-500/30">
    <!-- Sidebar -->
    <aside class="w-64 border-r border-neutral-800 bg-neutral-900/50 flex flex-col p-6 hidden md:flex">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-8 h-8 bg-white rounded flex items-center justify-center text-black font-bold text-sm">S</div>
            <span class="font-bold text-lg tracking-tight">SnapIt</span>
        </div>
        <nav class="flex flex-col gap-2">
            <a href="{% url 'dashboard' %}"
                class="{% if request.resolver_match.url_name == 'dashboard' %}bg-neutral-800 text-white{% else %}text-neutral-400 hover:bg-neutral-800/50 hover:text-white{% endif %} px-4 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-3">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                </svg>
                Dashboard
            </a>
            <a href="{% url 'history' %}"
                class="{% if request.resolver_match.url_name == 'history' %}bg-neutral-800 text-white{% else %}text-neutral-400 hover:bg-neutral-800/50 hover:text-white{% endif %} px-4 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-3">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                History
            </a>
            <a href="{% url 'billing_page' %}"
                class="{% if request.resolver_match.url_name == 'billing_page' %}bg-neutral-800 text-white{% else %}text-neutral-400 hover:bg-neutral-800/50 hover:text-white{% endif %} px-4 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-3">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="5" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="2" y1="10" x2="22" y2="10"></line>
                </svg>
                Billing
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative h-full overflow-y-auto">
        <header
            class="h-16 border-b border-neutral-800 bg-neutral-900/30 flex items-center justify-between px-8 sticky top-0 z-10 backdrop-blur-md">
            <div class="md:hidden font-bold tracking-tight">SnapIt</div>
            <div class="ml-auto flex items-center gap-6 text-sm text-neutral-400">
                <a href="{% url 'billing_page' %}"
                    class="flex items-center gap-2.5 bg-neutral-800/40 hover:bg-neutral-800 px-3 py-1.5 rounded-md border border-neutral-700/50 hover:border-neutral-600 transition-all cursor-pointer"
                    title="Manage Billing & Credits">
                    <span class="text-xs font-semibold text-neutral-400 uppercase tracking-wider">Credits</span>
                    <div class="h-3.5 w-px bg-neutral-700"></div>
                    <span class="font-medium text-white flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
                        {{ request.user.credit_wallet.balance|default:"0" }}
                    </span>
                </a>
                <span>{{ request.user.email }}</span>
            </div>
        </header>
        <div class="p-8 max-w-5xl mx-auto w-full">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>

</html>
