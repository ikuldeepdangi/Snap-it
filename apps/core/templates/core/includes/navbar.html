<header
    class="h-16 border-b border-neutral-800 bg-neutral-900/30 flex items-center justify-between px-6 md:px-8 sticky top-0 z-10 backdrop-blur-md">
    <div class="md:hidden flex items-center gap-4 font-bold tracking-tight">
        <button onclick="toggleSidebar()"
            class="p-1.5 text-neutral-400 hover:text-white rounded-md transition-colors focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <span>Snap<span class="text-[#00c2ff]">It</span></span>
    </div>
    <div class="ml-auto flex items-center gap-6 text-sm text-neutral-400">
        <a href="{% url 'billing_page' %}"
            class="flex items-center gap-2.5 bg-neutral-800/40 hover:bg-neutral-800 px-3 py-1.5 rounded-md border border-neutral-700/50 hover:border-neutral-600 transition-all cursor-pointer"
            title="Manage Billing & Credits">
            <span class="text-xs font-semibold text-neutral-400 uppercase tracking-wider">Credits</span>
            <div class="h-3.5 w-px bg-neutral-700"></div>
            <span class="font-medium text-white flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                    <line x1="2" y1="10" x2="22" y2="10"></line>
                </svg>
                {{ request.user.credit_wallet.balance|default:"0" }}
            </span>
        </a>
    </div>
</header>
