<div class="flex items-center gap-3 bg-neutral-900/40 border border-neutral-800/80 rounded-xl px-4 py-2 w-max mb-8">
    <div class="flex items-center gap-2">
        <div class="w-5 h-5 rounded-md bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0">
            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <span class="text-sm font-semibold text-neutral-200">Resume Configured</span>
        <svg class="w-3.5 h-3.5 text-emerald-400 ml-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span class="text-sm text-neutral-400 font-medium truncate max-w-[250px] ml-1">{{ resume.file.name|slice:"8:" }}</span>
    </div>
    
    <form method="POST" action="{% url 'dashboard' %}" enctype="multipart/form-data" id="replace-form" class="flex items-center ml-2 border-l border-neutral-800 pl-4">
        {% csrf_token %}
        <button type="button" onclick="document.getElementById('replace-file').click()" class="text-xs text-neutral-300 hover:text-white bg-neutral-800 hover:bg-neutral-700 px-3 py-1.5 rounded-lg transition-colors font-medium">
            Change
        </button>
        <input type="file" name="resume_file" id="replace-file" accept="application/pdf" class="hidden" onchange="document.getElementById('replace-form').submit();">
    </form>
</div>
