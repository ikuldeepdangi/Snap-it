<div
    class="flex flex-col gap-3 bg-neutral-900/40 border border-neutral-800/80 rounded-xl px-4 py-3 w-full sm:w-max mb-8">
    <!-- Top row: Status and Edit button -->
    <div class="flex items-center justify-between w-full gap-8">
        <div class="flex items-center gap-2">
            <div
                class="w-5 h-5 rounded-md bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0">
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <span class="text-sm font-semibold text-neutral-200">Resume Configured</span>
        </div>

        <form method="POST" action="{% url 'dashboard' %}" enctype="multipart/form-data" id="replace-form">
            {% csrf_token %}
            <button type="button" onclick="document.getElementById('replace-file').click()"
                class="text-neutral-500 hover:text-white transition-colors p-1 rounded-md hover:bg-neutral-800"
                title="Change Resume">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
            </button>
            <input type="file" name="resume_file" id="replace-file" accept="application/pdf" class="hidden"
                onchange="handleResumeReupload(this);">
        </form>
    </div>

    <!-- Bottom row: Filename -->
    <div
        class="flex items-center gap-2 text-sm text-neutral-400 font-medium bg-[#0a0a0a] border border-neutral-800/60 px-3 py-2 rounded-lg">
        <svg class="w-4 h-4 shrink-0 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span class="truncate max-w-[260px] sm:max-w-[300px]">{{ resume.filename }}</span>
    </div>
</div>

<!-- Full Screen Loader Overlay -->
<div id="reupload-loader" class="fixed inset-0 z-[999] hidden items-center justify-center bg-black/80 backdrop-blur-md">
    <div class="border border-neutral-800 bg-neutral-900/60 backdrop-blur-xl rounded-[2rem] p-12 max-w-xl w-full mx-4 shadow-2xl flex flex-col items-center justify-center">
        {% load static %}
        <div class="relative w-24 h-24 mb-6">
            <!-- Pulse rings -->
            <div class="absolute inset-0 rounded-full bg-indigo-500/20 animate-ping opacity-75"></div>
            <div class="absolute inset-2 rounded-full bg-indigo-500/30 animate-pulse"></div>
            <!-- App logo bouncing -->
            <img src="{% static 'logo.png' %}" alt="SnapIt Logo" class="absolute inset-0 w-full h-full object-contain animate-bounce drop-shadow-[0_0_15px_rgba(99,102,241,0.5)]">
        </div>
        <h3 class="text-xl font-bold text-white mb-2 animate-pulse">Updating Resume...</h3>
        <p class="text-sm text-neutral-400 text-center">Extracting context and securely syncing to cloud storage</p>
    </div>
</div>

<script>
function handleResumeReupload(input) {
    if (input.files && input.files[0]) {
        const loader = document.getElementById('reupload-loader');
        loader.classList.remove('hidden');
        loader.classList.add('flex');
        document.getElementById('replace-form').submit();
    }
}
</script>
