<div class="text-center py-8 sm:py-16 px-4">
    <div class="w-20 h-20 bg-indigo-500/10 rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(99,102,241,0.2)]">
        <svg class="w-10 h-10 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
    </div>
    <h2 class="text-3xl font-bold mb-3 tracking-tight text-white">Welcome to Snap<span class="text-[#00c2ff]">It</span></h2>
    <p class="text-neutral-400 mb-10 max-w-lg mx-auto leading-relaxed text-sm sm:text-base">Upload your PDF resume to get started. We'll use this context to generate highly personalized cold outreach emails automatically.</p>
    
    <form method="POST" action="{% url 'dashboard' %}" enctype="multipart/form-data" id="upload-form">
        {% csrf_token %}
        <div onclick="document.getElementById('file-upload').click()" class="border-2 border-dashed border-neutral-700 hover:border-indigo-500/60 bg-neutral-900/40 hover:bg-indigo-500/5 transition-all duration-300 rounded-[2rem] p-8 sm:p-16 max-w-xl mx-auto cursor-pointer group shadow-2xl relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-br from-indigo-500/0 to-indigo-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            
            <div class="w-16 h-16 rounded-2xl bg-neutral-800 border border-neutral-700 group-hover:border-indigo-500/50 flex items-center justify-center mx-auto mb-6 transition-all group-hover:-translate-y-2 group-hover:shadow-lg group-hover:shadow-indigo-500/20">
                <svg class="w-8 h-8 text-neutral-400 group-hover:text-indigo-400 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </div>
            <p class="font-semibold text-xl mb-2 text-white group-hover:text-indigo-300 transition-colors">Select Resume PDF</p>
            <p class="text-sm text-neutral-500 font-medium">Drag & drop or click to browse</p>
            <input type="file" name="resume_file" id="file-upload" accept="application/pdf" class="hidden" onchange="document.getElementById('upload-form').submit();">
        </div>
    </form>
</div>
