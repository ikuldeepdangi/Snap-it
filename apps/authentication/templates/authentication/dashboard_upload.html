<h1 style="font-size: 24px; font-weight: 600; margin-bottom: 8px;">Upload Your Resume</h1>
<p style="color: var(--text-muted); font-size: 14px; margin-bottom: 32px;">Upload your PDF resume to start generating targeted emails.</p>

<div style="background-color: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden;">
    <div style="padding: 24px; text-align: center;">
        <form method="POST" enctype="multipart/form-data" action="{% url 'dashboard' %}" id="upload-form">
            {% csrf_token %}
            <div style="border: 1px dashed var(--border-color); border-radius: 8px; padding: 40px; background-color: var(--bg-panel); cursor: pointer; transition: all 0.2s;" id="drop-zone" onclick="document.getElementById('file-upload').click()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 12px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <div style="font-size: 14px; color: var(--text-main); font-weight: 500; margin-bottom: 4px;">Click to upload or drag and drop</div>
                <div style="font-size: 12px; color: var(--text-muted);">PDF files only</div>
                <input type="file" name="resume_file" id="file-upload" accept="application/pdf" style="display: none;" onchange="document.getElementById('upload-form').submit();">
            </div>
        </form>
    </div>
</div>
<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-upload');
    const uploadForm = document.getElementById('upload-form');

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#60A5FA';
        dropZone.style.backgroundColor = '#1E293B';
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--border-color)';
        dropZone.style.backgroundColor = 'var(--bg-panel)';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--border-color)';
        dropZone.style.backgroundColor = 'var(--bg-panel)';
        
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            uploadForm.submit();
        }
    });
</script>
