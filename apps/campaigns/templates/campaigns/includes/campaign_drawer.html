<!-- ==========================================
     DRAWER: Detail View 
=========================================== -->
<div id="campaign-drawer" class="fixed inset-0 z-[100] hidden">
    <!-- Backdrop -->
    <div id="drawer-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity opacity-0" onclick="closeDrawer()"></div>
    
    <!-- Drawer Panel -->
    <div id="drawer-panel" class="absolute right-0 top-0 bottom-0 w-full max-w-[500px] bg-[#111318] border-l border-white/10 shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
        
        <!-- Header Image area -->
        <div class="h-32 bg-gradient-to-br from-[#161A22] to-zinc-900 relative border-b border-white/5">
            <button onclick="closeDrawer()" class="absolute top-4 right-4 p-2 rounded-lg bg-black/40 hover:bg-black/60 text-white backdrop-blur-md transition-colors border border-white/10">
                <i class="ph-bold ph-x"></i>
            </button>
            <!-- Logo overlap -->
            <div class="absolute -bottom-10 left-8 w-20 h-20 rounded-2xl bg-zinc-900 border-4 border-[#111318] flex items-center justify-center shadow-lg overflow-hidden">
                <span id="d-logo-letter" class="text-3xl font-bold text-white"></span>
            </div>
        </div>
        
        <!-- Content -->
        <div class="px-8 pt-14 pb-8 overflow-y-auto flex-1 custom-scrollbar">
            
            <div class="flex items-start justify-between mb-6">
                <div>
                    <h2 id="d-company" class="text-3xl font-bold text-white tracking-tight flex items-center gap-2">
                        Company Name
                    </h2>
                    <div class="flex items-center gap-3 mt-2 text-sm">
                        <a id="d-domain" href="#" target="_blank" class="text-[#4F8CFF] hover:underline flex items-center gap-1">
                            <i class="ph-bold ph-link text-xs"></i> <span id="d-domain-text">website.com</span>
                        </a>
                        <span class="text-zinc-700">&bull;</span>
                        <span id="d-location" class="text-zinc-400 flex items-center gap-1"><i class="ph-fill ph-map-pin"></i> Location</span>
                    </div>
                </div>
                <div id="d-status" class="mt-1"></div>
            </div>

            <!-- Properties (Notion style) -->
            <div class="space-y-3 mb-8">
                <div class="flex items-center text-sm border-b border-white/5 pb-2">
                    <div class="w-1/3 text-zinc-500 flex items-center gap-2"><i class="ph-fill ph-code"></i> Tech Stack</div>
                    <div class="w-2/3 text-zinc-200 font-medium" id="d-tech"></div>
                </div>
                <div class="flex items-center text-sm border-b border-white/5 pb-2">
                    <div class="w-1/3 text-zinc-500 flex items-center gap-2"><i class="ph-fill ph-shield-check"></i> Verified</div>
                    <div class="w-2/3 text-zinc-200 font-medium"><span class="bg-[#22C55E]/20 text-[#22C55E] px-2 py-0.5 rounded text-xs flex items-center gap-1 w-max"><i class="ph-fill ph-check-circle"></i> High Confidence</span></div>
                </div>
            </div>

            <div id="d-failure-box" class="hidden bg-[#EF4444]/10 border border-[#EF4444]/20 rounded-xl p-4 text-sm text-[#EF4444] mb-6">
                <p class="font-bold mb-1 flex items-center gap-1"><i class="ph-fill ph-warning-circle"></i> Processing Skipped</p>
                <p id="d-failure-reason" class="text-xs"></p>
            </div>

            <!-- Recipients section -->
            <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2"><i class="ph-fill ph-users"></i> Target Details</h3>
            <div class="space-y-3">
                <!-- Primary HR -->
                <div class="bg-[#161A22] border border-white/5 rounded-xl p-4 hover:border-[#4F8CFF]/30 transition-colors">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="bg-indigo-500/20 text-indigo-400 text-[9px] uppercase tracking-wider font-bold px-2 py-0.5 rounded flex items-center gap-1 w-max"><i class="ph-fill ph-star"></i> Primary Target</span>
                            <p class="text-xs font-semibold text-zinc-500 mt-2">HR / Talent Acquisition</p>
                            <p id="d-hr-email" class="text-sm font-medium text-white mt-0.5"></p>
                        </div>
                        <a id="d-evidence-hr" href="#" target="_blank" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center text-zinc-400 hover:text-white transition-colors" title="View Source">
                            <i class="ph-bold ph-arrow-square-out"></i>
                        </a>
                    </div>
                </div>

                <!-- Optional CCs -->
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <div class="bg-[#161A22] border border-white/5 rounded-xl p-4">
                        <span class="bg-zinc-800 text-zinc-400 text-[9px] uppercase tracking-wider font-bold px-2 py-0.5 rounded">Routing CC</span>
                        <p class="text-xs font-semibold text-zinc-500 mt-2">Founder / C-Level</p>
                        <p id="d-founder" class="text-xs font-medium text-white mt-1 truncate"></p>
                    </div>
                    <div class="bg-[#161A22] border border-white/5 rounded-xl p-4">
                        <span class="bg-zinc-800 text-zinc-400 text-[9px] uppercase tracking-wider font-bold px-2 py-0.5 rounded">Routing CC</span>
                        <p class="text-xs font-semibold text-zinc-500 mt-2">Engineering Lead</p>
                        <p id="d-eng-lead" class="text-xs font-medium text-white mt-1 truncate"></p>
                    </div>
                </div>
            </div>
            
            <div class="mt-8 bg-[#4F8CFF]/10 rounded-xl p-4 border border-[#4F8CFF]/20 flex items-center justify-between">
                <div class="flex gap-3 items-center">
                    <div class="w-10 h-10 rounded-full bg-[#4F8CFF]/20 flex items-center justify-center text-[#4F8CFF]"><i class="ph-fill ph-paper-plane-right"></i></div>
                    <div>
                        <h4 class="text-sm font-bold text-[#4F8CFF]">Automated Outreach</h4>
                        <p class="text-[11px] text-[#4F8CFF]/70">Email sequence scheduled via pipeline.</p>
                    </div>
                </div>
                <button class="px-3 py-1.5 bg-[#4F8CFF] text-white text-xs font-bold rounded-lg shadow-lg shadow-[#4F8CFF]/20 hover:bg-blue-500 transition-colors border border-blue-400">
                    View Logs
                </button>
            </div>
        </div>
    </div>
</div>
