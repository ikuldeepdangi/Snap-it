<!-- Manual Payment Modal (Hidden by Default) -->
<div id="manual-payment-modal" onclick="if(event.target === this) closeManualModal();" class="fixed inset-0 bg-black/80 z-50 hidden backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[#111] border border-neutral-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl transform transition-all duration-300">
        <!-- Header -->
        <div class="px-6 py-4 border-b border-neutral-800/60 flex items-center justify-between bg-neutral-900/30">
            <h3 class="text-lg font-semibold text-white">Manual Top-Up Request</h3>
            <button onclick="closeManualModal()" class="text-neutral-500 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <!-- Form Content -->
        <form action="{% url 'manual_payment_request' %}" method="POST" enctype="multipart/form-data" class="p-6">
            {% csrf_token %}
            
            <div class="mb-6 flex flex-col items-center text-center">
                <p class="text-sm text-neutral-400 mb-4">Scan the QR code below using any UPI app to make your payment.</p>
                <!-- Actual QR Code image -->
                <div class="bg-white p-2 rounded-xl mb-3 shadow-lg">
                    <img src="/media/payment/snap-it-payment-QR.jpeg" alt="UPI QR Code" class="w-32 h-32 md:w-40 md:h-40 rounded-lg object-contain">
                </div>
                <div class="bg-neutral-800/50 border border-neutral-700/50 rounded-lg px-4 py-2 flex items-center gap-3">
                    <span class="text-sm font-medium text-white tracking-wide">{{ UPI_ID }}</span>
                    <button type="button" onclick="navigator.clipboard.writeText('{{ UPI_ID|escapejs }}'); alert('UPI ID copied!');" class="text-indigo-400 hover:text-indigo-300">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    </button>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wider mb-2">Amount Paid (₹)</label>
                    <input type="number" name="amount" id="manual-amount" required readonly
                        class="w-full bg-[#0a0a0a] border border-neutral-700 focus:border-indigo-500 rounded-lg px-4 py-3 text-white outline-none transition-colors">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-neutral-500 uppercase tracking-wider mb-2">Transaction Screenshot</label>
                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-neutral-700 border-dashed rounded-lg cursor-pointer bg-[#0a0a0a] hover:bg-neutral-900/50 transition-colors">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-8 h-8 mb-3 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <p class="mb-1 text-sm text-neutral-400"><span class="font-semibold text-white">Click to upload</span> or drag and drop</p>
                            <p class="text-xs text-neutral-500">PNG, JPG up to 10MB</p>
                        </div>
                        <input type="file" name="screenshot" accept="image/*" class="hidden" required multiple onchange="updateFileName(this)" />
                    </label>
                    <p id="file-name-display" class="mt-2 text-xs text-emerald-400 hidden flex items-center gap-1.5"></p>
                </div>
            </div>

            {% if request.user.profile.gmail_connected %}
            <button type="submit" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-indigo-500/20">
                Submit Request
            </button>
            {% else %}
            <a href="{% url 'connect_gmail' %}" class="w-full mt-6 flex justify-center items-center bg-amber-600 hover:bg-amber-500 text-white text-sm font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-amber-500/20">
                Connect Gmail to Request Topup
            </a>
            <p class="mt-3 text-xs text-center text-neutral-500">You must link your Google account to send the automated top-up request.</p>
            {% endif %}
        </form>
    </div>
</div>

<script>
    function updateFileName(input) {
        const display = document.getElementById('file-name-display');
        if (input.files && input.files.length > 0) {
            let text = input.files.length === 1 ? input.files[0].name : `${input.files.length} files selected`;
            display.innerHTML = `<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span class="truncate">${text}</span>`;
            display.classList.remove('hidden');
        } else {
            display.classList.add('hidden');
        }
    }
</script>
